<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EE6B76"/>
      <stop offset="100%" stop-color="#E0414F"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7AEB5"/>
      <stop offset="100%" stop-color="#EE8A95"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="100" height="100" rx="22" fill="#FBE9EC"/>
  <!-- top-left: coral (lollipop) -->
  <rect x="7" y="7" width="41" height="41" rx="11" fill="url(#c)"/>
  <!-- top-right: pink stripes -->
  <rect x="52" y="7" width="41" height="41" rx="11" fill="url(#p)"/>
  <!-- bottom-left: coral (bear) -->
  <rect x="7" y="52" width="41" height="41" rx="11" fill="url(#c)"/>
  <!-- bottom-right: pink (heart) -->
  <rect x="52" y="52" width="41" height="41" rx="11" fill="url(#p)"/>
  <!-- sheen on each tile -->
  <ellipse cx="27" cy="18" rx="14" ry="8" fill="rgba(255,255,255,.3)"/>
  <ellipse cx="72" cy="18" rx="14" ry="8" fill="rgba(255,255,255,.3)"/>
  <ellipse cx="27" cy="63" rx="14" ry="8" fill="rgba(255,255,255,.3)"/>
  <ellipse cx="72" cy="63" rx="14" ry="8" fill="rgba(255,255,255,.3)"/>
</svg>
